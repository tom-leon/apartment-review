# Alembic changes the database tables to match models/. The database address comes
# from DATABASE_URL (see migrations/env.py), the same one the app uses.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Format each new migration file the way CI checks it.
[post_write_hooks]
hooks = black
black.type = exec
black.executable = black
black.options = -q REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
