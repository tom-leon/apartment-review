name: backend

on:
  push:
    branches: [main]
    paths:
      - "apartment-review-fastapi/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apartment-review-fastapi
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run black --check .
      - run: uv run flake8 .
      - run: uv run pytest
      - run: docker build .
